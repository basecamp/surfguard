name: Dependabot auto-merge

# Zero-touch automation for Bundler PATCH/MINOR updates only. Everything else
# (bundler major, all github-actions PRs) stays human-gated: never
# auto-approved, never auto-merged.
#
# The approval comes from the org's PR bot App, not GITHUB_TOKEN: the org
# doesn't let Actions create or approve pull requests. main requires one
# approving review, so an approval that this workflow can't give leaves the
# PR waiting for a person, which is the safe failure.
#
# Why pull_request, not pull_request_target: GitHub blocks
# pull_request_target by default in public repositories (this one) from
# 2026-12-02, and pull_request_target puts a privileged token and secrets
# next to an untrusted head. On pull_request, a run Dependabot triggers gets
# a read-only GITHUB_TOKEN, which the `permissions` below raise, and sees
# only Dependabot secrets, never Actions secrets. So PR_BOT_PRIVATE_KEY must
# also exist as a Dependabot secret available to this repository. Fork PRs
# get no secrets and a read-only token, and fail the gates anyway.
#
# On pull_request the workflow definition comes from the PR's merge commit,
# not from main. Dependabot's bundler PRs touch only Gemfile and Gemfile.lock,
# and the API validation below refuses any file but Gemfile.lock before the
# App token is minted.
# A Dependabot github-actions PR rewrites `uses:` pins, including the ones in
# this file, but its head ref is dependabot/github_actions/..., so every job
# here is skipped before a newly pinned action could run with the key.
# Nothing PR-controlled is checked out or executed: every job works through
# the GitHub API.
on: pull_request

permissions: {}

# One run per PR; a new push supersedes the in-flight validation of stale state.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Dependabot metadata
    if: github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'dependabot/bundler/') # zizmor: ignore[bot-conditions] -- actor + triggering_actor are paired with GitHub-owned PR identity, protected-main base, and same-repository head checks; the privileged job repeats these checks through the API
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # fetch-metadata only reads the PR
    timeout-minutes: 10
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      package-ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
    steps:
      # fetch-metadata reads the PR; it also independently verifies the user
      # and Dependabot's signed commits (skip-verification defaults to false).
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  automerge:
    name: Auto-merge bundler patch/minor
    needs: metadata
    # Actor/author gating happened at the metadata job (a skipped metadata job
    # skips this one); it is repeated here so this job, which holds the App
    # key, never depends on another job's condition alone. The first step
    # below independently re-validates all of it via the API before the App
    # token is minted. fetch-metadata emits the full "version-update:" prefix
    # — match it exactly.
    if: github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/bundler/') && needs.metadata.outputs.package-ecosystem == 'bundler' && (needs.metadata.outputs.update-type == 'version-update:semver-patch' || needs.metadata.outputs.update-type == 'version-update:semver-minor') # zizmor: ignore[bot-conditions] -- same pairing as the metadata job: actor + triggering_actor with the GitHub-owned PR author and head ref, on pull_request, where GitHub sets the actor from who triggered the event; the first step re-checks them through the API before the App token is minted
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge --auto needs the merge permission
      pull-requests: write # auto-merge state (the approval uses the App token)
    timeout-minutes: 10
    steps:
      - name: Re-validate the PR via the API (nothing checked out, nothing executed)
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          METADATA_ECOSYSTEM: ${{ needs.metadata.outputs.package-ecosystem }}
          METADATA_UPDATE_TYPE: ${{ needs.metadata.outputs.update-type }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ "$EVENT_ACTOR" = "dependabot[bot]" ] || fail "actor is ${EVENT_ACTOR}"
          [ "$EVENT_TRIGGERING_ACTOR" = "dependabot[bot]" ] || fail "triggering actor is ${EVENT_TRIGGERING_ACTOR}"

          pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          state="$(jq -r .state <<<"$pr")"
          draft="$(jq -r .draft <<<"$pr")"
          author="$(jq -r .user.login <<<"$pr")"
          head_ref="$(jq -r .head.ref <<<"$pr")"
          head_sha="$(jq -r .head.sha <<<"$pr")"
          head_repo="$(jq -r .head.repo.full_name <<<"$pr")"
          base_ref="$(jq -r .base.ref <<<"$pr")"
          base_sha="$(jq -r .base.sha <<<"$pr")"
          base_repo="$(jq -r .base.repo.full_name <<<"$pr")"

          [ "$state" = "open" ] || fail "PR state is ${state}"
          [ "$draft" = "false" ] || fail "PR is a draft"
          [ "$author" = "dependabot[bot]" ] || fail "author is ${author}"
          case "$head_ref" in
            dependabot/bundler/*) ;;
            *) fail "head ref is ${head_ref}" ;;
          esac
          # TOCTOU guard: the head we validated is the head we merge (also
          # enforced at merge time with --match-head-commit).
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail "head SHA is malformed"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || fail "base SHA is malformed"
          [ "$head_sha" = "$EVENT_HEAD_SHA" ] || fail "head moved: ${head_sha} != ${EVENT_HEAD_SHA}"
          # The branch must live in this repo (Dependabot's own branch, which
          # maintainers control) — fork heads are never auto-merged.
          [ "$head_repo" = "$REPO" ] || fail "head repo is ${head_repo}"
          # The validator is executable trusted-base code. Pin its authority to
          # this repository's protected main branch, never an editable PR base.
          [ "$base_repo" = "$REPO" ] || fail "base repo is ${base_repo}"
          [ "$base_ref" = "main" ] || fail "base ref is ${base_ref}"

          # Automatic changes are lockfile-only. Gemfile changes always need
          # human review.
          files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          [ -n "$files" ] || fail "no changed files reported"
          while IFS= read -r file; do
            case "$file" in
              Gemfile.lock) ;;
              *) fail "unexpected changed file: ${file}" ;;
            esac
          done <<<"$files"

          # Every commit must be authored by Dependabot, committed by GitHub's
          # signer (web-flow — Dependabot commits are created and signed
          # server-side), and signature-verified.
          commits="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --slurp | jq 'add')"
          jq --exit-status --arg sha "$head_sha" '
            length > 0 and .[-1].sha == $sha and
            all(.[]; .author.login == "dependabot[bot]" and .committer.login == "web-flow" and .commit.verification.verified == true)
          ' <<<"$commits" >/dev/null \
            || fail "unverified or non-Dependabot commits present"

          # Fetch the validator from the trusted base and both lockfiles at
          # exact SHAs through the API. No PR code is checked out or executed.
          fetch_file() {
            path="$1"; sha="$2"; destination="$3"
            gh api "repos/${REPO}/contents/${path}?ref=${sha}" --jq .content | tr -d '\n' | base64 --decode > "$destination"
          }
          fetch_file .github/scripts/validate_dependabot_lockfile.rb "$base_sha" validator.rb
          fetch_file Gemfile.lock "$base_sha" base.lock
          fetch_file Gemfile.lock "$head_sha" head.lock
          ruby validator.rb base.lock head.lock "$METADATA_ECOSYSTEM" "$METADATA_UPDATE_TYPE"

          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUMBER} re-validated at ${EVENT_HEAD_SHA}"
      # Only after validation passed. PR_BOT_PRIVATE_KEY resolves from the
      # Dependabot secrets (see the header); with no key or client id this step
      # fails, nothing is approved, and the PR waits for a person. The token
      # is scoped to this repository and to pull requests only.
      - name: Mint the PR bot token
        id: pr-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Approve at the validated head and enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BOT_TOKEN: ${{ steps.pr-bot.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATED_BASE_SHA: ${{ steps.validation.outputs.base_sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$PR_BOT_TOKEN" ] || fail "no PR bot token"

          # This is called at both privilege boundaries. A stable head alone is
          # insufficient: the PR must still be open/non-draft, authored by
          # Dependabot, based on this repository's protected main branch, and
          # composed entirely of current Dependabot-signed commits.
          revalidate_current_pr() {
            phase="$1"
            pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
            jq --exit-status '
                .state == "open" and .draft == false and
                .user.login == "dependabot[bot]" and
                (.head.ref | startswith("dependabot/bundler/"))
              ' <<<"$pr" >/dev/null || fail "PR state or author changed ${phase}"
            jq --exit-status \
              --arg repo "$REPO" \
              --arg head "$EVENT_HEAD_SHA" \
              --arg base "$VALIDATED_BASE_SHA" '
                .head.sha == $head and .head.repo.full_name == $repo and
                .base.sha == $base and .base.ref == "main" and
                .base.repo.full_name == $repo
              ' <<<"$pr" >/dev/null || fail "PR base or head identity changed ${phase}"

            commits="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --slurp | jq 'add')"
            jq --exit-status --arg sha "$EVENT_HEAD_SHA" '
              length > 0 and .[-1].sha == $sha and
              all(.[]; .author.login == "dependabot[bot]" and .committer.login == "web-flow" and .commit.verification.verified == true)
            ' <<<"$commits" >/dev/null || fail "commit identity or signature changed ${phase}"
          }

          # Narrow the validate->approve window, then pin the approval itself
          # to the validated commit via the API (gh pr review has no
          # head-binding flag). --auto defers the actual merge until required
          # checks finish, so the merge boundary is enforced server-side at
          # merge time, not by this script: --match-head-commit restricts the
          # merge to exactly the validated head; the strict (up-to-date)
          # required-status rule forces any base advance through a new head,
          # which dismiss-stale-reviews strips of its approval and the revoke
          # job strips of pending auto-merge. There is no merge queue, so no
          # merge_group hook exists to revalidate in; these branch-rule gates
          # are the merge-time revalidation.
          # The approval is the App's; GITHUB_TOKEN reads and arms auto-merge.
          revalidate_current_pr "before approval"
          GH_TOKEN="$PR_BOT_TOKEN" gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -f commit_id="$EVENT_HEAD_SHA" \
            -f event=APPROVE \
            -f body="Auto-approving a Dependabot bundler patch/minor update at ${EVENT_HEAD_SHA}. The required CI check still gates the merge."
          revalidate_current_pr "before merge"
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$EVENT_HEAD_SHA"

  # Auto-merge enablement survives pushes by users with write access, and
  # those human-triggered synchronize events skip the validation path above.
  # Retract the automation instead: dismiss-stale-reviews (branch rule)
  # retracts the bot approval; this job retracts the pending auto-merge.
  revoke:
    name: Revoke auto-merge on human intervention
    if: github.event.action == 'synchronize' && github.event.pull_request.user.login == 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # disabling auto-merge requires merge authority
      pull-requests: write # auto-merge state lives on the PR
    timeout-minutes: 10
    steps:
      - name: Disable any pending auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          enabled="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.auto_merge != null')"
          if [ "$enabled" = "true" ]; then
            gh pr merge "$PR_URL" --disable-auto
            echo "Auto-merge disabled: a non-Dependabot actor pushed to this Dependabot PR."
          else
            echo "Auto-merge was not enabled; nothing to revoke."
          fi
      - name: Dismiss any standing bot approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The main ruleset's dismiss-stale-reviews rule already retracts
          # approvals on push; this makes the workflow self-contained rather
          # than dependent on that setting staying configured. Every bot's
          # approval goes: the PR bot App's (its login is the App's slug plus
          # [bot]), github-actions[bot]'s from before the App, and any other
          # bot's, so after a person's push only a person's review stands.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq '.[] | select(.user.type == "Bot" and .state == "APPROVED") | .id' |
          while IFS= read -r review_id; do
            gh api --method PUT "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}/dismissals" \
              -f message="Dismissing the automated approval: a non-Dependabot actor pushed to this PR after it was granted."
            echo "Dismissed review ${review_id}"
          done
