name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

# Least privilege: no default grants; every job declares exactly what it needs.
permissions: {}

# One run per ref; superseded pushes cancel stale runs (but never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: "Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    # head tracks unreleased Ruby — surface breakage early without blocking a merge.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.4.5", "3.4", "4.0", "head" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Bare Ruby on purpose: prove the gem and its suite need nothing
          # beyond the standard library (rake/minitest ship with Ruby).
          bundler-cache: false
      - name: Reject vulnerable effective resolv versions
        run: ruby script/check_resolv_version.rb
      - run: rake test

  lint:
    name: RuboCop, coverage, release-script fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec ruby script/check_resolv_version.rb
      - run: bundle exec rubocop
      # Coverage thresholds plus the release-script fixture tests (test/release/).
      - run: bundle exec rake test
        env:
          COVERAGE: "1"
      - run: ruby script/generate_iana_data.rb --check
      # dependency-review only screens vulnerable/licensed deps — it does not
      # reject a benign new runtime dependency. Enforce the invariant here so
      # a spec.add_dependency fails the PR, not the eventual release build.
      - name: Assert zero runtime dependencies
        run: |
          ruby -e '
            spec = Gem::Specification.load("surfguard.gemspec")
            deps = spec.runtime_dependencies
            abort "runtime dependencies are forbidden: #{deps.map(&:name).join(", ")}" unless deps.empty?
            puts "zero runtime dependencies: ok"
          '

  lint-actions:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ShellCheck is available (actionlint shells out to it)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck --version
      - name: Install actionlint (checksum-verified; it is not a GitHub action)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --silent --show-error --fail --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          mkdir --parents "${RUNNER_TEMP}/actionlint"
          tar --extract --gzip --file actionlint.tar.gz --directory "${RUNNER_TEMP}/actionlint" actionlint
          rm actionlint.tar.gz
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color
      - name: Run zizmor (pedantic, over the whole tree — dependabot.yml included)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .
          collect: all
          persona: pedantic
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Zero runtime deps is a hard invariant; dev deps get reviewed too.
          fail-on-scopes: development, runtime, unknown
          show-openssf-scorecard: false

  package-build:
    name: Build package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.5"
          bundler-cache: false
      - name: Determine package version
        id: version
        run: echo "version=$(ruby -Ilib -rsurfguard/version -e 'puts Surfguard::VERSION')" >> "$GITHUB_OUTPUT"
      - name: Build candidate
        run: |
          bundle install --jobs 4 --retry 3
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build --strict surfguard.gemspec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-rubygem
          path: surfguard-${{ steps.version.outputs.version }}.gem
          if-no-files-found: error

  package:
    name: Fresh-runner isolated package suite
    needs: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.5"
          bundler-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-rubygem
      - name: Verify exact package against this commit and installed bytes
        env:
          VERSION: ${{ needs.package-build.outputs.version }}
        run: ruby script/release/verify_package.rb "surfguard-${VERSION}.gem" surfguard "$VERSION" "$GITHUB_SHA"

  platforms:
    name: "Core suite (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.5"
          bundler-cache: false
      - run: ruby script/check_resolv_version.rb
      - run: ruby -Itest -e 'Dir["test/surfguard*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - run: ruby script/generate_iana_data.rb --check

  musl:
    name: Core suite (pinned musl)
    runs-on: ubuntu-latest
    container: ruby:3.4.5-alpine3.22@sha256:e284f39a2103a564dca9771a81bfecb455b04cd3be4149b133ed7e508ef1b65f
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ruby script/check_resolv_version.rb
      - run: ruby -Itest -e 'Dir["test/surfguard*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - run: ruby script/generate_iana_data.rb --check

  iana-drift:
    name: IANA semantic drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.5"
          bundler-cache: false
      - run: ruby script/generate_iana_data.rb --check
      - run: ruby script/check_iana_drift.rb

  go-test:
    name: "Go ${{ matrix.go }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 1.23 is the module floor; stable proves the current toolchain.
        go: [ "1.23.x", "stable" ]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          # Zero dependencies means no go.sum for the cache key to hash.
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  go-lint:
    name: Go lint, coverage, generated tables
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Generated IANA tables match the checked-in snapshots
        run: go run ./generate -check
      - name: Assert zero dependencies
        run: |
          test ! -f go.sum || { echo "go.sum exists: the module grew a dependency"; exit 1; }
          ! grep -E '^require' go.mod || { echo "go.mod grew a require directive"; exit 1; }
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code
      - name: staticcheck
        env:
          # staticcheck lags new Go majors: it cannot decode the export data of
          # a toolchain released after it ("export data version N is greater
          # than maximum supported version M"), which broke every run the day
          # go1.27 became stable. Analyze with the newest toolchain the pinned
          # release supports rather than following stable, and keep the rest of
          # this job — and the whole go-test matrix — on stable so the new
          # toolchain is still exercised. Raise both together.
          GOTOOLCHAIN: go1.26.6
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          # v1.1.4 panics parsing a go1.27 source tree ("unexpected expr:
          # *ast.KeyValueExpr"). Unlike staticcheck this one has a release that
          # understands the new toolchain, so scan with the real stable
          # toolchain rather than pinning GOTOOLCHAIN — the point of this step
          # is to judge what CI actually builds with.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Coverage gate (100% of the library package)
        run: |
          # The surfguard library package is held at 100%; the go/generate
          # maintainer tool is covered by its own tests (run in go-test) apart
          # from its main() shell, so it is not part of this exact-match gate.
          go test -coverprofile=coverage.out .
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          echo "total statement coverage: ${total}"
          test "${total}" = "100.0%" || { echo "coverage gate requires 100.0%"; exit 1; }
      - name: Module is self-contained (isolated copy, no repo parent)
        run: |
          # Prove the module needs nothing beneath the repo root: copy go/ to a
          # scratch dir with no ../conformance or ../script, and run the suite
          # and the generator there. The drift tests skip (mirror authoritative)
          # and everything else must pass, matching a downloaded module zip.
          tmp="$(mktemp -d)"
          cp -R . "$tmp/surfguard-go"
          cd "$tmp/surfguard-go"
          go test ./...
          go run ./generate -check

  go-fuzz:
    name: Go fuzz smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: Fuzz each target briefly (checked-in corpora run in go-test)
        run: |
          for target in FuzzBlocked FuzzLegacyIPv4Parser FuzzClassifyHost; do
            go test -run=NONE -fuzz="^${target}$" -fuzztime=30s .
          done

  codeql:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Repository default setup owns SARIF uploads. This independently runs
      # the same pinned analyzer as a required CI fan-in job without creating
      # an incompatible second code-scanning configuration.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ruby
            build-mode: none
          # The Go module lives at go/; manual build-mode traces `go build`
          # there so the analyzer sees the whole package.
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        working-directory: go
        run: go build ./...
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: never
          upload-database: false

  # Stable fan-in for branch protection: require exactly one check ("CI")
  # regardless of how the matrix or job list evolves.
  ci:
    name: CI
    if: always()
    timeout-minutes: 15
    needs: [ test, lint, lint-actions, dependency-review, package-build, package, platforms, musl, iana-drift, codeql, go-test, go-lint, go-fuzz ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Permit only the event-gated drift job to be skipped
        if: needs.iana-drift.result == 'skipped' && github.event_name != 'push' && github.event_name != 'pull_request'
        run: exit 1
      - name: Permit dependency review to skip only outside pull requests
        if: needs.dependency-review.result == 'skipped' && github.event_name == 'pull_request'
        run: exit 1
      - name: Reject every other skipped required job
        if: needs.test.result == 'skipped' || needs.lint.result == 'skipped' || needs.lint-actions.result == 'skipped' || needs.package-build.result == 'skipped' || needs.package.result == 'skipped' || needs.platforms.result == 'skipped' || needs.musl.result == 'skipped' || needs.codeql.result == 'skipped' || needs.go-test.result == 'skipped' || needs.go-lint.result == 'skipped' || needs.go-fuzz.result == 'skipped'
        run: exit 1
      - name: All green
        run: echo "All required jobs succeeded (or were legitimately skipped)."
