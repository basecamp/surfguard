name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege: no default grants; every job declares exactly what it needs.
permissions: {}

# One run per ref; superseded pushes cancel stale runs (but never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: "Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # head tracks unreleased Ruby — surface breakage early without blocking a merge.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.1", "3.2", "3.3", "3.4", "4.0", "head" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Bare Ruby on purpose: prove the gem and its suite need nothing
          # beyond the standard library (rake/minitest ship with Ruby).
          bundler-cache: false
      - run: rake test

  lint:
    name: RuboCop, coverage, release-script fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      # Coverage thresholds plus the release-script fixture tests (test/release/).
      - run: bundle exec rake test
        env:
          COVERAGE: "1"
      # dependency-review only screens vulnerable/licensed deps — it does not
      # reject a benign new runtime dependency. Enforce the invariant here so
      # a spec.add_dependency fails the PR, not the eventual release build.
      - name: Assert zero runtime dependencies
        run: |
          ruby -e '
            spec = Gem::Specification.load("surfguard.gemspec")
            deps = spec.runtime_dependencies
            abort "runtime dependencies are forbidden: #{deps.map(&:name).join(", ")}" unless deps.empty?
            puts "zero runtime dependencies: ok"
          '

  lint-actions:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ShellCheck is available (actionlint shells out to it)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck --version
      - name: Install actionlint (checksum-verified; it is not a GitHub action)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --silent --show-error --fail --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          mkdir --parents "${RUNNER_TEMP}/actionlint"
          tar --extract --gzip --file actionlint.tar.gz --directory "${RUNNER_TEMP}/actionlint" actionlint
          rm actionlint.tar.gz
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color
      - name: Run zizmor (pedantic, over the whole tree — dependabot.yml included)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .
          collect: all
          persona: pedantic
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Zero runtime deps is a hard invariant; dev deps get reviewed too.
          fail-on-scopes: development, runtime, unknown
          show-openssf-scorecard: false

  # Stable fan-in for branch protection: require exactly one check ("CI")
  # regardless of how the matrix or job list evolves.
  ci:
    name: CI
    if: always()
    needs: [ test, lint, lint-actions, dependency-review ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All green
        run: echo "All required jobs succeeded (or were legitimately skipped)."
